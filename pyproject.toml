[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "files2gdrive"
version = "0.1.1"
description = "Ubuntu to Google Drive backup engine"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
  "watchdog>=6,<7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "google-api-python-client>=2.160,<3",
  "google-auth>=2.38,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-auth-httplib2>=0.2,<1",
  "keyring>=25,<26",
  "SecretStorage>=3.3,<4",
]

[project.scripts]
files2gdrive = "files2gdrive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
files2gdrive = ["web/*.html", "web/*.css", "web/*.js", "assets/*.svg"]
